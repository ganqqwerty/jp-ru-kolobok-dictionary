[project]
work_dir = "work/wadoku-recovery"
dist_dir = "dist"
target_language = "ru"

[database]
backend = "sqlite"
sqlite_path = "work/wadoku-recovery/progress.sqlite3"
url_env = "WADOKU_POSTGRES_URL"
pool_max = 4
checkout_timeout_seconds = 10

[versions]
extractor = "extractor-plain-glossary-v1"
terminology = "terminology-ru-v1"
pipeline = "lexicographer-v2"
translation_prompt = "translate-luna-de-ru-v1"
review_prompt = "review-terra-luna-blind-v4"

[models.translation]
id = "gpt-5.6-luna"
reasoning_effort = "medium"

[models.review]
id = "gpt-5.6-terra"
reasoning_effort = "medium"

[batch]
soft_max_articles = 99
soft_max_bytes = 24576
soft_max_units = 100
singleton_threshold_bytes = 16384
hard_max_article_bytes = 49152
hard_max_article_units = 200
structured_output_contract = "per-manifest-v3"
